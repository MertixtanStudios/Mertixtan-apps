<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flowly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000;
      --card: rgba(18, 18, 24, 0.82);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f4f4f8;
      --muted: #9a9aab;
      --neon: #00f0ff;
      --neon2: #ff2bd6;
      --rgb: linear-gradient(90deg, #ff0000, #ff8000, #ffff00, #00ff00, #00ffff, #0040ff, #8000ff, #ff00ff, #ff0000);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Poppins", system-ui, sans-serif;
      overflow: hidden;
    }

    /* ---------- Ekranlar ---------- */
    .screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.7s ease, visibility 0.7s;
      overflow-y: auto;
    }
    .screen.active { opacity: 1; visibility: visible; }

    /* ---------- Sağdan sola akan, duvara çarpıp geri dönen RGB ---------- */
    .rgb-text, .rgb-bg {
      background-image: var(--rgb);
      background-size: 400% 100%;
      animation: rgbBounce 2.4s ease-in-out infinite alternate;
    }
    .rgb-text {
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    @keyframes rgbBounce {
      from { background-position: 100% 50%; } /* sağ duvar */
      to   { background-position: 0% 50%; }   /* sol duvar -> alternate ile geri döner */
    }

    /* ---------- Açılış (toplam 3.5 sn) ---------- */
    #intro { transition: opacity 1.2s ease, visibility 1.2s; z-index: 10; }
    .intro-inner { text-align: center; }

    .brand {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 900;
      font-size: clamp(64px, 18vw, 170px);
      line-height: 1.1;
      padding: 0 0.15em 0.18em;
      opacity: 0;
      transform: scale(0.15);
      animation:
        rgbBounce 2.4s ease-in-out infinite alternate,
        growIn 1.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }
    @keyframes growIn {
      0%   { opacity: 0; transform: scale(0.15); filter: blur(8px); }
      60%  { opacity: 1; filter: blur(0); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    .brand-line {
      height: 4px;
      width: min(70vw, 460px);
      margin: 6px auto 0;
      border-radius: 4px;
      transform: scaleX(0);
      animation:
        rgbBounce 2.4s ease-in-out infinite alternate,
        drawLine 0.8s ease-out 1.8s forwards;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
    }
    @keyframes drawLine { to { transform: scaleX(1); } }

    .studio {
      margin-top: 18px;
      font-weight: 300;
      letter-spacing: 0.35em;
      font-size: clamp(12px, 3vw, 18px);
      color: #d9d9e3;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.7s ease-out 2.6s forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    /* ---------- Kartlar ---------- */
    .card {
      position: relative;
      width: min(100%, 400px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 36px 28px 28px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 60px rgba(0, 240, 255, 0.06);
      animation: cardIn 0.6s ease both;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } }

    .logo {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 900;
      font-size: 40px;
      padding: 0 0.1em 0.15em;
      text-align: center;
      margin-bottom: 18px;
    }
    .question { text-align: center; color: var(--muted); margin-bottom: 26px; }

    .stack { display: grid; gap: 12px; }
    form { display: grid; gap: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus { border-color: var(--neon); box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.15); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      border: 1px solid transparent;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn.primary {
      background: linear-gradient(90deg, var(--neon), var(--neon2));
      color: #050510;
    }
    .btn.primary:hover { box-shadow: 0 0 22px rgba(0, 240, 255, 0.45); }
    .btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .btn.ghost:hover { border-color: var(--neon); }
    .switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
    a { color: var(--neon); text-decoration: none; }

    .back {
      position: absolute; top: 14px; left: 14px;
      background: none; border: 0; color: var(--muted);
      font-size: 22px; cursor: pointer;
    }
    .back:hover { color: var(--text); }

    /* ---------- Yakında (neon) ---------- */
    #home { background: #02020a; }
    .neon-bg {
      position: absolute; inset: -20%;
      background:
        radial-gradient(circle at 25% 30%, rgba(0, 240, 255, 0.22), transparent 40%),
        radial-gradient(circle at 75% 70%, rgba(255, 43, 214, 0.22), transparent 40%),
        radial-gradient(circle at 60% 20%, rgba(120, 80, 255, 0.18), transparent 35%);
      filter: blur(30px);
      animation: drift 12s ease-in-out infinite alternate;
    }
    @keyframes drift { to { transform: translate(4%, -3%) rotate(8deg) scale(1.05); } }

    .home-inner { position: relative; text-align: center; display: grid; gap: 22px; justify-items: center; }
    .welcome { color: #cfd3ff; font-weight: 300; }
    .badge {
      display: inline-block; margin-left: 6px; padding: 2px 10px;
      border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.15em;
      color: #ffd84a; border: 1px solid #ffd84a; box-shadow: 0 0 12px rgba(255, 216, 74, 0.5);
    }
    .neon {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 900;
      font-size: clamp(44px, 11vw, 110px);
      color: #e9fdff;
      text-shadow:
        0 0 6px #fff,
        0 0 14px var(--neon),
        0 0 32px var(--neon),
        0 0 60px var(--neon2),
        0 0 100px var(--neon2);
      animation: flicker 4s infinite;
    }
    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: 0.55; }
    }
    .neon-sub { color: #b8c4ff; letter-spacing: 0.08em; }
    #logout { width: auto; padding: 10px 28px; }

    /* ---------- Toast ---------- */
    #toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translate(-50%, 30px);
      max-width: calc(100vw - 32px);
      padding: 12px 18px;
      border-radius: 12px;
      background: #15151f;
      border: 1px solid var(--neon);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.3);
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 50;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.error { border-color: #ff4d6d; box-shadow: 0 0 18px rgba(255, 77, 109, 0.35); }

    @media (prefers-reduced-motion: reduce) {
      .rgb-text, .rgb-bg, .neon, .neon-bg { animation-duration: 0.01s; }
    }
  </style>
</head>
<body>
  <!-- 1) Açılış animasyonu -->
  <section id="intro" class="screen active" aria-label="Flowly açılış">
    <div class="intro-inner">
      <h1 class="brand rgb-text">Flowly</h1>
      <div class="brand-line rgb-bg"></div>
      <p class="studio">MertixtanStudios</p>
    </div>
  </section>

  <!-- 2) Kayıt mı / Giriş mi -->
  <section id="choice" class="screen">
    <div class="card">
      <h2 class="logo rgb-text">Flowly</h2>
      <p class="question">Kayıt mı olacaksınız, giriş mi yapacaksınız?</p>
      <div class="stack">
        <button class="btn primary" data-go="login">Giriş Yap</button>
        <button class="btn ghost" data-go="register">Kayıt Ol</button>
      </div>
    </div>
  </section>

  <!-- 3) Giriş -->
  <section id="login" class="screen">
    <div class="card">
      <button class="back" data-go="choice" aria-label="Geri">&larr;</button>
      <h2 class="logo rgb-text">Giriş Yap</h2>
      <form id="loginForm" autocomplete="on">
        <label>Ad Soyad veya kullanıcı adı
          <input name="name" required autocomplete="username" />
        </label>
        <label>Şifre
          <input name="password" type="password" required autocomplete="current-password" />
        </label>
        <button class="btn primary" type="submit">Giriş Yap</button>
      </form>
      <p class="switch">Hesabın yok mu? <a href="#" data-go="register">Kayıt ol</a></p>
    </div>
  </section>

  <!-- 4) Kayıt -->
  <section id="register" class="screen">
    <div class="card">
      <button class="back" data-go="choice" aria-label="Geri">&larr;</button>
      <h2 class="logo rgb-text">Kayıt Ol</h2>
      <form id="registerForm" autocomplete="on">
        <div class="row">
          <label>Ad
            <input name="firstName" required autocomplete="given-name" />
          </label>
          <label>Soyad
            <input name="lastName" required autocomplete="family-name" />
          </label>
        </div>
        <label>Şifre
          <input name="password" type="password" minlength="6" required autocomplete="new-password" />
        </label>
        <button class="btn primary" type="submit">Kayıt Ol</button>
      </form>
      <p class="switch">Zaten hesabın var mı? <a href="#" data-go="login">Giriş yap</a></p>
    </div>
  </section>

  <!-- 5) Yakında -->
  <section id="home" class="screen">
    <div class="neon-bg"></div>
    <div class="home-inner">
      <p class="welcome">Hoş geldin, <span id="userName"></span> <span id="ownerBadge" class="badge" hidden>OWNER</span></p>
      <h2 class="neon">Yakında Geliyor</h2>
      <p class="neon-sub">Flowly çok yakında burada. Akışa hazır ol.</p>
      <button class="btn ghost" id="logout">Çıkış Yap</button>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const INTRO_MS = 3500; // açılış animasyonu toplam süresi
      const USERS_KEY = "flowly.users";
      const SESSION_KEY = "flowly.session";

      /*
       * Sistemde tanımlı owner hesapları.
       * Şifreler düz metin olarak değil, SHA-256 özeti olarak saklanır:
       *   sha256("flowly|" + id + ":" + şifre)
       */
      const OWNERS = [
        {
          id: "mertixtanstudios",
          name: "MertixtanStudios",
          email: "mertozokur@gmail.com",
          passHash: "c52b41c2c720c20c6bbdc0238e412e5f7d92630bd71f63e037be6b3a80a9337b",
        },
        {
          id: "kaplan10_p2",
          name: "Kaplan10_p2",
          passHash: "ae7e57ed59cd34fa5189ba2ce16a3ac65f8f6f2857b5c263c7db9fbffc7242f5",
        },
      ];

      // ---------- Yardımcılar ----------
      const $ = (sel) => document.querySelector(sel);
      const normalize = (s) => s.trim().replace(/\s+/g, " ").toLocaleLowerCase("tr-TR");

      // Saf JS SHA-256: crypto.subtle yalnızca güvenli bağlamda (https / localhost) vardır,
      // telefondan http://192.168.x.x ile açıldığında bu yedek kullanılır.
      function sha256Fallback(bytes) {
        const K = [];
        for (let n = 2, c = 0; c < 64; n++) {
          let prime = true;
          for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
          if (prime) K[c++] = (Math.cbrt(n) % 1) * 2 ** 32 | 0;
        }
        const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
        const len = bytes.length;
        const total = ((len + 9 + 63) >> 6) << 6;
        const m = new Uint8Array(total);
        m.set(bytes);
        m[len] = 0x80;
        const dv = new DataView(m.buffer);
        dv.setUint32(total - 4, len * 8);
        dv.setUint32(total - 8, Math.floor(len / 0x20000000));
        const w = new Int32Array(64);
        const rotr = (x, r) => (x >>> r) | (x << (32 - r));
        for (let off = 0; off < total; off += 64) {
          for (let i = 0; i < 16; i++) w[i] = dv.getInt32(off + i * 4);
          for (let i = 16; i < 64; i++) {
            const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
            const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
            w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
          }
          let [a, b, c, d, e, f, g, h] = H;
          for (let i = 0; i < 64; i++) {
            const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
            const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
            h = g; g = f; f = e; e = (d + t1) | 0;
            d = c; c = b; b = a; a = (t1 + t2) | 0;
          }
          [a, b, c, d, e, f, g, h].forEach((v, i) => (H[i] = (H[i] + v) | 0));
        }
        return H.map((v) => (v >>> 0).toString(16).padStart(8, "0")).join("");
      }

      async function sha256(text) {
        const bytes = new TextEncoder().encode(text);
        if (!window.crypto?.subtle) return sha256Fallback(bytes);
        const buf = await crypto.subtle.digest("SHA-256", bytes);
        return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
      }
      const passwordHash = (id, password) => sha256(`flowly|${id}:${password}`);

      let toastTimer;
      function toast(msg, isError = false, ms = 3500) {
        const el = $("#toast");
        el.textContent = msg;
        el.classList.toggle("error", isError);
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), ms);
      }

      // ---------- Depolama ----------
      function readUsers() {
        try {
          return JSON.parse(localStorage.getItem(USERS_KEY)) || [];
        } catch {
          return [];
        }
      }
      function writeUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
      }
      function upsertUser(user) {
        const users = readUsers();
        const i = users.findIndex((u) => u.id === user.id);
        if (i >= 0) users[i] = user;
        else users.push(user);
        writeUsers(users);
      }
      const findById = (id) => readUsers().find((u) => u.id === id);

      // Owner hesaplarını sisteme kaydet
      function seedOwners() {
        for (const o of OWNERS) upsertUser({ ...o, role: "owner" });
      }

      const getSession = () => {
        try { return localStorage.getItem(SESSION_KEY); } catch { return null; }
      };
      const setSession = (id) =>
        id ? localStorage.setItem(SESSION_KEY, id) : localStorage.removeItem(SESSION_KEY);

      // ---------- Ekran yönetimi ----------
      function show(id) {
        document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
      }

      document.addEventListener("click", (e) => {
        const go = e.target.closest("[data-go]");
        if (go) {
          e.preventDefault();
          show(go.dataset.go);
        }
      });

      // ---------- Giriş ----------
      $("#loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = new FormData(e.target);
        const ident = normalize(data.get("name"));
        const password = data.get("password");

        const candidates = readUsers().filter(
          (u) => normalize(u.name) === ident || (u.firstName && normalize(u.firstName) === ident)
        );

        for (const u of candidates) {
          if (u.passHash && (await passwordHash(u.id, password)) === u.passHash) {
            e.target.reset();
            enter(u);
            return;
          }
        }
        toast("Ad veya şifre hatalı.", true);
      });

      // ---------- Kayıt ----------
      $("#registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = new FormData(e.target);
        const firstName = data.get("firstName").trim();
        const lastName = data.get("lastName").trim();
        const name = `${firstName} ${lastName}`;
        const id = normalize(name);

        if (findById(id)) {
          toast("Bu ad soyad ile zaten bir hesap var. Giriş yapın.", true);
          return;
        }
        const user = {
          id,
          firstName,
          lastName,
          name,
          passHash: await passwordHash(id, data.get("password")),
          role: "user",
          createdAt: new Date().toISOString(),
        };
        upsertUser(user);
        e.target.reset();
        enter(user);
      });

      // ---------- Ana ekran ----------
      function enter(user) {
        setSession(user.id);
        $("#userName").textContent = user.name;
        $("#ownerBadge").hidden = user.role !== "owner";
        show("home");
      }

      $("#logout").addEventListener("click", () => {
        setSession(null);
        show("choice");
      });

      // ---------- Başlangıç ----------
      seedOwners();
      setTimeout(() => {
        const id = getSession();
        const user = id && findById(id);
        if (user) enter(user);
        else show("choice");
      }, INTRO_MS);
    })();
  </script>
</body>
</html>
